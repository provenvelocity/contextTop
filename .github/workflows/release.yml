name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust: x86_64-unknown-linux-gnu
            engine: engine
          - os: macos-14
            target: darwin-arm64
            rust: aarch64-apple-darwin
            engine: engine
          - os: macos-14
            target: darwin-x64
            rust: x86_64-apple-darwin
            engine: engine
          - os: windows-latest
            target: win32-x64
            rust: x86_64-pc-windows-msvc
            engine: engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build engine (release)
        run: cargo build --release --bin engine --target ${{ matrix.rust }}
      - name: Bundle engine into the extension
        shell: bash
        run: |
          mkdir -p apps/vscode/bin
          cp "target/${{ matrix.rust }}/release/${{ matrix.engine }}" "apps/vscode/bin/${{ matrix.engine }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - name: Install extension deps
        working-directory: apps/vscode
        run: npm ci
      - name: Package VSIX
        working-directory: apps/vscode
        run: npx vsce package --target ${{ matrix.target }} -o contexttop-${{ matrix.target }}.vsix
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          cp "apps/vscode/contexttop-${{ matrix.target }}.vsix" "dist/"
          cp "target/${{ matrix.rust }}/release/${{ matrix.engine }}" "dist/engine-${{ matrix.target }}${{ matrix.engine == 'engine.exe' && '.exe' || '' }}"
      - name: Upload assets
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: find dist -type f
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
