name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust engine (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build engine (release)
        run: cargo build --release --bin engine
      - name: Upload engine binary
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-x64
          path: target/release/engine
          if-no-files-found: error

  extension:
    name: VS Code extension (compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Compile
        run: npm run compile

  docs:
    name: Docs (links + whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check docs
        run: python scripts/check-docs.py
