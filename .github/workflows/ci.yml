name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docs:
    name: Docs (links + whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python scripts/check-docs.py

  package:
    name: Package (${{ matrix.target }})
    needs: [lint-test, docs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            rust: x86_64-unknown-linux-gnu
            engine: engine
          - os: macos-14
            target: darwin-arm64
            rust: aarch64-apple-darwin
            engine: engine
          - os: macos-14
            target: darwin-x64
            rust: x86_64-apple-darwin
            engine: engine
          - os: windows-latest
            target: win32-x64
            rust: x86_64-pc-windows-msvc
            engine: engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build engine (release)
        run: cargo build --release --bin engine --target ${{ matrix.rust }}
      - name: Bundle engine into the extension
        shell: bash
        run: |
          mkdir -p apps/vscode/bin
          cp "target/${{ matrix.rust }}/release/${{ matrix.engine }}" "apps/vscode/bin/${{ matrix.engine }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - name: Install extension deps
        working-directory: apps/vscode
        run: npm ci
      - name: Package VSIX
        working-directory: apps/vscode
        run: npx vsce package --target ${{ matrix.target }} -o contexttop-${{ matrix.target }}.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: contexttop-${{ matrix.target }}-vsix
          path: apps/vscode/contexttop-${{ matrix.target }}.vsix
          if-no-files-found: error
      - name: Upload engine binary
        uses: actions/upload-artifact@v6
        with:
          name: engine-${{ matrix.target }}
          path: target/${{ matrix.rust }}/release/${{ matrix.engine }}
          if-no-files-found: error
