[workspace]
members = ["crates/contexttop-core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"
authors = ["contextTop contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
ulid = "1"
